:root{--f:'Hubot Sans','SF Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--bg:#0f1a2e;--b1:#21406e;--b2:#2c3068;--b3:#174a5e;--fg:#ece6da;--muted:#9ba6ba;--accent:#d9b98a;--ink:#1c2433;
--glass:rgba(255,255,255,.075);--glass2:rgba(255,255,255,.13);--stroke:rgba(255,255,255,.16);--hi:rgba(255,255,255,.22);--line:rgba(255,255,255,.10);--shadow:0 14px 36px rgba(0,0,0,.38);--cl:66%;--ss:62%;
--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.5;overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
textarea,input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg{width:100%;height:100%;display:block;pointer-events:none}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.field{position:absolute;inset:0;z-index:0}
.fl{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}.fl.on{opacity:1}
.fl i{position:absolute;border-radius:50%;will-change:transform;animation:drift 28s ease-in-out infinite alternate}
.fl i:nth-child(1){width:130vmax;height:130vmax;top:-62vmax;left:-58vmax;background:radial-gradient(closest-side,var(--b1),transparent)}
.fl i:nth-child(2){width:125vmax;height:125vmax;bottom:-60vmax;right:-58vmax;background:radial-gradient(closest-side,var(--b2),transparent);animation-delay:-9s}
.fl i:nth-child(3){width:80vmax;height:80vmax;top:32%;left:14%;background:radial-gradient(closest-side,var(--b3),transparent);opacity:.8;animation-delay:-16s}
@keyframes drift{to{transform:translate3d(6vmax,4vmax,0) scale(1.08)}}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border:1px solid var(--stroke);box-shadow:var(--shadow),inset 0 1px 0 var(--hi),inset 0 0 24px rgba(255,255,255,.05)}
.flat{background:var(--glass);border:1px solid var(--stroke);box-shadow:0 8px 24px rgba(0,0,0,.10),inset 0 1px 0 var(--hi),inset 0 0 30px color-mix(in srgb,var(--cc,transparent) 18%,transparent)}
.rb{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .35s var(--spring)}
.rb:active{transform:scale(.88)}.rb svg{width:24px;height:24px}
.page{position:absolute;inset:0;z-index:1;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 200px;-webkit-overflow-scrolling:touch;scrollbar-width:none;transform-origin:50% 100%;transition:transform .6s var(--ease),opacity .5s,border-radius .5s}
.page::-webkit-scrollbar{display:none}
.under{transform:scale(.93) translateY(10px);opacity:.45;border-radius:40px}
.page.in>*{animation:rise .6s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:8px}
.hd h1{margin:0;font-size:40px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.sub{color:var(--muted);font-size:14.5px;margin-top:2px}
.hbtns{display:flex;gap:10px}
.search{display:flex;align-items:center;gap:11px;height:54px;border-radius:99px;padding:0 20px;margin-top:16px}
.search svg{width:22px;height:22px;opacity:.65;flex:none}

/* ---------- dates (Gregorian + Jalali) ---------- */
function g2j(gy,gm,gd){const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;const gy2=gm>2?gy+1:gy;let days=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);const jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
const JM=['Farvardin','Ordibehesht','Khordad','Tir','Mordad','Shahrivar','Mehr','Aban','Azar','Dey','Bahman','Esfand'];
const GM=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const GMF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const parts=d=>{d=new Date(d);return S.cal==='j'?g2j(d.getFullYear(),d.getMonth()+1,d.getDate()):[d.getFullYear(),d.getMonth()+1,d.getDate()]};
const monthName=(m,full)=>S.cal==='j'?JM[m-1]:(full?GMF:GM)[m-1];
const p2=n=>String(n).padStart(2,'0');
const dayKey=d=>{d=new Date(d);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
const clock=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())};
function when(t){const n=new Date(),d=new Date(t);if(dayKey(n)===dayKey(d))return clock(t);const y=new Date(n);y.setDate(n.getDate()-1);if(dayKey(y)===dayKey(d))return 'Yesterday';const q=parts(t);return q[2]+' '+monthName(q[1])+(q[0]!==parts(n)[0]?' '+q[0]:'')}
function whenFull(t){const n=new Date(),d=new Date(t),q=parts(t);const day=dayKey(n)===dayKey(d)?'Today':q[2]+' '+monthName(q[1],1)+(q[0]!==parts(n)[0]?' '+q[0]:'');return day+', '+clock(t)}

let idb=null;const IMG={};
function idbOpen(){return new Promise(res=>{if(idb)return res(idb);try{const r=indexedDB.open('hcl-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('i');r.onsuccess=()=>{idb=r.result;res(idb)};r.onerror=()=>res(null)}catch(e){res(null)}})}
const idbReq=(mode,fn)=>idbOpen().then(d=>d?new Promise(res=>{try{const tx=d.transaction('i',mode),r=fn(tx.objectStore('i'));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>res(null)}catch(e){res(null)}}):null);
const imgGet=async id=>{if(IMG[id])return IMG[id];const v=await idbReq('readonly',s=>s.get(id));if(v)IMG[id]=v;return v};
const imgPut=(id,v)=>{IMG[id]=v;return idbReq('readwrite',s=>s.put(v,id))};
const imgDel=id=>{delete IMG[id];return idbReq('readwrite',s=>s.delete(id))};
function shrink(file){return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=1280,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>res(null);im.src=u})}

/* ---------- PIN lock ---------- */
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(let i=0;i<s.length;i++)h=(h*33)^s.charCodeAt(i);return String(h>>>0)}}
const unlocked=new Set();let lockEl=null;
function pinPad(title,sub,check,cancel){
  if(lockEl)lockEl.remove();
  const el=document.createElement('div');el.className='lock';lockEl=el;
  el.innerHTML='<h2>'+esc(title)+'</h2><div class="sub" id="ps">'+esc(sub||'')+'</div><div class="dots" id="pd"><i></i><i></i><i></i><i></i></div><div class="pad">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button data-k="'+n+'">'+n+'</button>').join('')+(cancel?'<button class="x" data-k="c">Cancel</button>':'<span></span>')+'<button data-k="0">0</button><button data-k="d" aria-label="Delete">'+ic('del',2)+'</button></div>';
  $('#app').appendChild(el);let v='';
  const paint=()=>$$('#pd i',el).forEach((d,i)=>d.classList.toggle('f',i<v.length));
  el.addEventListener('click',async e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;
    if(k==='c'){el.remove();lockEl=null;cancel&&cancel();return}
    if(k==='d'){v=v.slice(0,-1);paint();return}
    if(v.length>=4)return;v+=k;paint();
    if(v.length===4){const r=await check(v);
      if(r===true){setTimeout(()=>{el.style.transition='opacity .35s';el.style.opacity=0;setTimeout(()=>{el.remove();if(lockEl===el)lockEl=null},350)},120)}
      else{const d=$('#pd',el);d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');if(typeof r==='string'&&r){$('#ps',el).textContent=r}else{$('#ps',el).textContent='Wrong PIN'}setTimeout(()=>{v='';paint()},380)}}
  });
}
function askPin(title,ok,cancel){pinPad(title,'Enter your PIN',async v=>{if((await sha((S.pin.s||'')+v))===S.pin.h){ok();return true}return false},cancel)}
function setPin(done){
  let first='';
  pinPad('New PIN','Choose 4 digits',async v=>{
    if(!first){first=v;setTimeout(()=>{$('#ps')&&($('#ps').textContent='Enter it again')},0);return 'Enter it again'}
    if(v!==first){first='';return 'Does not match. Start again'}
    const s=uid();S.pin={s,h:await sha(s+v)};save();toast('PIN saved');done&&done();return true},()=>{});
}

function cardHTML(n,i){

  '<h3 dir="auto">'+esc(n.t||(sn?sn.slice(0,40):'Untitled'))+'</h3>'+
  (locked?'<p class="lk">'+ic('lock',2.4)+' Locked</p>':(sn&&n.t?'<p dir="auto">'+esc(sn)+'</p>':''))+
  (todos.length?'<div class="cl">'+todos.map(b=>'<div class="'+(b.c?'d':'')+'">'+ic(b.c?'chk':'chk',2.2)+'<span dir="auto">'+esc(b.x)+'</span></div>').join('')+'</div>':'')+

}
function estH(n){const todos=n.b.filter(b=>b.k==='todo'&&b.x).length;return 70+Math.min(100,snippet(n).length/22*21)+Math.min(4,todos)*28+(tagsOf(n).length?30:0)}
function masonry(list){
  const a=[],b=[];let ha=0,hb=0;list.forEach((n,i)=>{const h=estH(n),html=cardHTML(n,i);if(ha<=hb){a.push(html);ha+=h}else{b.push(html);hb+=h}});

  const ee=t.closest('[data-e]');
  if(ee){const a=ee.dataset.e;if(a==='close')closeEditor();else if(a==='more')editorMore();else if(a==='share')shareSheet(cur);return}
  const go=t.closest('[data-go]');if(go){const id=go.dataset.go;const n=id&&S.notes.find(x=>x.id===id);const mk=go.dataset.mk;
    if(n){const prev=cur;closeEditorQuick();setTimeout(()=>openEditor(n),60)}else if(mk){const nn=newNote();nn.t=mk;closeEditorQuick();setTimeout(()=>openEditor(nn),60)}return}
  const rm=t.closest('[data-rmimg]');if(rm){const id=rm.dataset.rmimg;cur.img=cur.img.filter(x=>x!==id);imgDel(id);paintImgs();touch();return}
  const im=t.closest('.ig');if(im){const u=IMG[im.dataset.im];if(u){$('#vimg').src=u;$('#viewer').classList.add('show')}return}
  if(t.id==='tz'||t.id==='es'){const last=cur.b.length-1;if(cur.b[last].x||cur.b[last].k==='hr'){cur.b.push({k:'p',x:''});paintBlocks(last+1)}focusBlock(cur.b.length-1)}
});
function closeEditorQuick(){const n=cur;cur=null;hideMenu();if(isEmpty(n))S.notes=S.notes.filter(x=>x!==n);save();ed.classList.remove('open','typing','focus');}
$('#viewer').addEventListener('click',()=>$('#viewer').classList.remove('show'));
function fmt(k){
  if(k==='tag'){const a=document.activeElement;if(a&&a.matches('textarea')&&a.id!=='et'){const i=+a.closest('.blk').dataset.i,v=a.value,p=a.selectionStart;cur.b[i].x=v.slice(0,p)+'#'+v.slice(p);paintBlocks();focusBlock(i,p+1);touch()}return}
  if(k==='img'){pickImage();return}
  const a=document.activeElement;let i=a&&a.closest&&a.closest('.blk')?+a.closest('.blk').dataset.i:cur.b.length-1;
  const b=cur.b[i];b.k=b.k===k?'p':k;b.c=false;paintBlocks();focusBlock(i);touch();
}
function pickImage(){$('#fimg').value='';$('#fimg').click()}
$('#fimg').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];if(!f||!cur)return;const u=await shrink(f);if(!u){toast('Could not read the image');return}
  const id=uid();await imgPut(id,u);cur.img.push(id);touch();paintImgs();toast('Image added');
});
/* editor menus */
function noteActions(n,inEditor){
  return '<button class="mi" data-na="pin">'+ic('pin')+(n.pin?'Unpin':'Pin to top')+'</button>'+
  '<button class="mi" data-na="color">'+ic('pal')+'Color</button>'+
  '<button class="mi" data-na="lock">'+ic(n.lock?'unlock':'lock')+(n.lock?'Remove lock':'Lock note')+'</button>'+
  (inEditor?'<button class="mi" data-na="focus">'+ic('focus')+'Focus mode</button>':'')+
  '<button class="mi" data-na="share">'+ic('share')+'Share</button>'+
  (n.del?'<button class="mi" data-na="restore">'+ic('undo')+'Restore</button><button class="mi red" data-na="purge">'+ic('trash')+'Delete forever</button>':'<button class="mi" data-na="arch">'+ic('arch')+(n.arch?'Unarchive':'Archive')+'</button><button class="mi red" data-na="del">'+ic('trash')+'Move to trash</button>');
}
function noteSheet(n,inEditor){
  openSheet('<h3 dir="auto">'+esc(n.t||'Note')+'</h3>'+noteActions(n,inEditor),r=>r.addEventListener('click',e=>{const b=e.target.closest('[data-na]');if(!b)return;doAction(n,b.dataset.na,inEditor)}));
}
function editorMore(){noteSheet(cur,true)}
function doAction(n,a,inEditor){
  const after=()=>{save();if(inEditor){paintMeta()}else render(false)};
  if(a==='pin'){n.pin=!n.pin;closeSheet(after);toast(n.pin?'Pinned':'Unpinned')}
  else if(a==='color'){closeSheet(()=>colorSheet(n,inEditor))}
  else if(a==='lock'){
    const go=()=>{n.lock=!n.lock;if(n.lock)unlocked.add(n.id);closeSheet(()=>{after();toast(n.lock?'Note locked':'Lock removed')})};
    if(!S.pin){closeSheet(()=>setPin(()=>{n.lock=true;unlocked.add(n.id);after();toast('Note locked')}))}else go()}
  else if(a==='focus'){closeSheet(()=>{ed.classList.toggle('focus')})}
  else if(a==='share'){closeSheet(()=>shareSheet(n))}
  else if(a==='arch'){n.arch=n.arch?0:1;closeSheet(()=>{if(inEditor)closeEditor();else after();toast(n.arch?'Archived':'Moved back')})}
  else if(a==='del'){n.del=Date.now();closeSheet(()=>{if(inEditor)closeEditor();else after();toast('Moved to trash')})}
  else if(a==='restore'){n.del=0;n.arch=0;closeSheet(()=>{after();toast('Restored')})}
  else if(a==='purge'){closeSheet(()=>confirmSheet('Delete this note forever?','Delete forever',()=>{purge(n);render(false)}))}
}
function purge(n){(n.img||[]).forEach(imgDel);S.notes=S.notes.filter(x=>x!==n);save()}
function colorSheet(n,inEditor){
  openSheet('<h3>Color</h3><div class="cdots"><button data-c="-1" class="'+(n.col<0?'on':'')+'" style="background:var(--glass2)" aria-label="None"></button>'+HUES.map((h,i)=>'<button data-c="'+i+'" class="'+(n.col===i?'on':'')+'" style="background:hsl('+h+' 78% 68%)"></button>').join('')+'</div>',r=>r.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;n.col=+b.dataset.c;save();closeSheet(()=>{if(!inEditor)render(false)})}));
}
/* ---------- share ---------- */
function noteText(n){return (n.t?n.t+'\n\n':'')+n.b.map(b=>b.k==='todo'?(b.c?'[x] ':'[ ] ')+b.x:b.k==='ul'?'• '+b.x:b.k==='h'?b.x.toUpperCase():b.k==='q'?'“'+b.x+'”':b.k==='hr'?'———':b.x).join('\n').trim()}
function b64(s){const by=new TextEncoder().encode(s);let o='';for(let i=0;i<by.length;i+=0x8000)o+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(o)}
async function shareFile(name,mime,data64){
  const FS=reg('Filesystem'),SH=reg('Share');
  try{
    if(NATIVE&&FS&&SH){await FS.writeFile({path:name,data:data64,directory:'CACHE'});const u=await FS.getUri({path:name,directory:'CACHE'});await SH.share({title:name,files:[u.uri]});return true}
  }catch(e){if(e&&/cancel/i.test(String(e.message||e)))return false}
  try{const bin=atob(data64),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);const blob=new Blob([a],{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[new File([blob],name,{type:mime})]})){await navigator.share({files:[new File([blob],name,{type:mime})]});return true}
    const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}catch(e){return false}
}
async function shareText(t,title){
  const SH=reg('Share');
  try{if(NATIVE&&SH){await SH.share({title:title||'Note',text:t,dialogTitle:'Share note'});return}if(navigator.share){await navigator.share({title,text:t});return}}catch(e){return}
  try{await navigator.clipboard.writeText(t);toast('Copied to clipboard')}catch(e){toast('Could not share')}
}
function shareSheet(n){
  openSheet('<h3>Share</h3><button class="mi" data-sh="text">'+ic('lines')+'As text</button><button class="mi" data-sh="img">'+ic('img')+'As a pretty image</button><button class="mi" data-sh="copy">'+ic('cp')+'Copy text</button>',r=>r.addEventListener('click',e=>{const b=e.target.closest('[data-sh]');if(!b)return;const k=b.dataset.sh;closeSheet(async()=>{
    if(k==='text')shareText(noteText(n),n.t);else if(k==='copy'){try{await navigator.clipboard.writeText(noteText(n));toast('Copied')}catch(e){toast('Could not copy')}}else{const u=await noteImage(n);if(u)shareFile('note.png','image/png',u.split(',')[1])}})}));
}
function wrap(ctx,text,max){const out=[];String(text).split('\n').forEach(par=>{let line='';par.split(/(\s+)/).forEach(w=>{const t=line+w;if(ctx.measureText(t).width>max&&line){out.push(line.trimEnd());line=w.trimStart()}else line=t});out.push(line.trimEnd())});return out}
async function noteImage(n){
  try{
    const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),cs=getComputedStyle(document.documentElement);
    const bg=cs.getPropertyValue('--bg').trim(),b1=cs.getPropertyValue('--b1').trim(),b2=cs.getPropertyValue('--b2').trim(),b3=cs.getPropertyValue('--b3').trim(),fg=cs.getPropertyValue('--fg').trim(),mu=cs.getPropertyValue('--muted').trim();
    x.fillStyle=bg;x.fillRect(0,0,W,H);
    const blob=(cx,cy,r,col)=>{const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,col);g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(0,0,W,H)};
    blob(100,60,900,b1);blob(1000,1300,900,b2);blob(300,800,600,b3);
    const px=90,py=110,pw=W-180,ph=H-260;x.save();x.beginPath();x.roundRect(px,py,pw,ph,80);x.fillStyle='rgba(255,255,255,.14)';x.fill();x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=3;x.stroke();x.clip();
    x.fillStyle=fg;x.font='700 64px "Hubot Sans","SF Arabic",sans-serif';x.textBaseline='top';
    const rtl=/[؀-ۿ]/.test(n.t||plain(n).slice(0,5));x.direction=rtl?'rtl':'ltr';x.textAlign=rtl?'right':'left';const tx=rtl?px+pw-70:px+70;
    let y=py+80;wrap(x,n.t||'Note',pw-140).slice(0,3).forEach(l=>{x.fillText(l,tx,y);y+=80});y+=24;
    x.font='400 40px "Hubot Sans","SF Arabic",sans-serif';x.fillStyle=fg;
    const lines=[];n.b.forEach(b=>{if(b.k==='hr'||!b.x)return;const pre=b.k==='todo'?(b.c?'☑ ':'☐ '):b.k==='ul'?'• ':'';wrap(x,pre+b.x,pw-140).forEach(l=>lines.push(l))});
    for(const l of lines){if(y>py+ph-110){x.fillStyle=mu;x.fillText('…',tx,y);break}x.fillText(l,tx,y);y+=58}
    x.restore();x.direction='ltr';x.textAlign='center';x.fillStyle=mu;x.font='500 34px "Hubot Sans",sans-serif';x.fillText('Hydrochloric acid',W/2,H-110);
    return c.toDataURL('image/png');
  }catch(e){toast('Could not make the image');return null}
}
/* ---------- backup ---------- */
async function exportBackup(){
  toast('Preparing backup…');const imgs={};for(const n of S.notes)for(const id of(n.img||[])){const u=await imgGet(id);if(u)imgs[id]=u}
  const d=new Date(),name='hydrochloric-acid-'+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'.json';
  const data=JSON.stringify({app:'hcl',v:1,t:Date.now(),notes:S.notes,imgs,set:{pal:S.pal,cal:S.cal,view:S.view}});
  const ok=await shareFile(name,'application/json',b64(data));if(ok)toast('Backup ready');
}
$('#fi').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(d.app!=='hcl'||!Array.isArray(d.notes))throw 0;
    let add=0,upd=0;const ex=new Map(S.notes.map(n=>[n.id,n]));
    for(const n of d.notes){const o=ex.get(n.id);if(!o){S.notes.push(n);add++}else if(n.u>o.u){Object.assign(o,n);upd++}}
    for(const id in(d.imgs||{}))await imgPut(id,d.imgs[id]);
    save();render(true);toast(add+' added, '+upd+' updated')}
  catch(err){toast('That is not a valid backup')}
  e.target.value='';
});
/* ---------- events ---------- */
let lp=null,lpFired=false;
const pg=$('#pg');
pg.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.card,.nr');lpFired=false;if(!c||!c.dataset.n)return;
  const sx=e.clientX,sy=e.clientY;c.classList.add('pr');
  lp=setTimeout(()=>{lpFired=true;c.classList.remove('pr');const n=S.notes.find(x=>x.id===c.dataset.n);if(n){try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}noteSheet(n,false)}},480);
  const mv=ev=>{if(Math.abs(ev.clientX-sx)>8||Math.abs(ev.clientY-sy)>8){clearTimeout(lp);c.classList.remove('pr')}};
  pg.addEventListener('pointermove',mv,{once:true});
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>pg.addEventListener(ev,()=>{clearTimeout(lp);$$('.card.pr').forEach(x=>x.classList.remove('pr'))}));
pg.addEventListener('scroll',()=>{clearTimeout(lp)},{passive:true});
pg.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;let list=sortNotes(live());if(fTag)list=list.filter(n=>tagsOf(n).includes(fTag));$('#res').innerHTML=resHTML(list)}});
document.addEventListener('click',async e=>{
  const t=e.target;
  const tb=t.closest('[data-tab]');if(tb){const k=tb.dataset.tab;if(k!==tab||sub){tab=k;sub=null;if(k!=='notes'){q=''}render(true)}return}
  if(t.closest('#fab')){openEditor(newNote(),$('#fab'));return}
  if(lpFired){lpFired=false;return}
  const card=t.closest('#pg .card,#pg .nr');if(card&&card.dataset.n){const n=S.notes.find(x=>x.id===card.dataset.n);if(n){if(n.del){noteSheet(n,false)}else openEditor(n,card)}return}
  const ft=t.closest('[data-ft]');if(ft){fTag=ft.dataset.ft||null;viewNotes();$('#pg').classList.remove('in');return}
  const tg=t.closest('[data-tg]');if(tg){fTag=tg.dataset.tg;tab='notes';render(true);return}
  const sb=t.closest('[data-sub]');if(sb){sub=sb.dataset.sub;render(true);return}
  const wk=t.closest('[data-wk]');if(wk){dayCur=new Date(dayCur.getTime()+7*86400000*(+wk.dataset.wk));viewDays();return}
  const dy=t.closest('[data-day]');if(dy){dayCur=new Date(+dy.dataset.day);viewDays();$('#pg').classList.remove('in');return}
  const pl=t.closest('[data-pal]');if(pl){S.pal=pl.dataset.pal;save();applyPal();$$('.sw1').forEach(b=>b.classList.toggle('on',b.dataset.pal===S.pal));return}
  const vw=t.closest('[data-view]');if(vw){S.view=vw.dataset.view;save();$$('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view));return}
  const cl=t.closest('[data-cal]');if(cl){S.cal=cl.dataset.cal;save();$$('[data-cal]').forEach(b=>b.classList.toggle('on',b.dataset.cal===S.cal));return}
  const a=t.closest('[data-a]');if(!a||t.closest('#ed'))return;
  switch(a.dataset.a){
    case 'new':openEditor(newNote(),a);break;
    case 'view':S.view=S.view==='list'?'cards':'list';save();viewNotes();$('#pg').classList.remove('in');break;
    case 'subback':sub=null;render(true);break;
    case 'emptytrash':confirmSheet('Empty the trash?','Delete all forever',()=>{S.notes.filter(n=>n.del).forEach(purge);render(false);toast('Trash emptied')});break;
    case 'lockapp':S.lockApp=!S.lockApp;save();a.classList.toggle('on',S.lockApp);break;
    case 'newpin':setPin(()=>render(false));break;
    case 'changepin':askPin('Current PIN',()=>setTimeout(()=>setPin(),380),()=>{});break;
    case 'rmpin':askPin('Enter your PIN',()=>{S.notes.forEach(n=>n.lock=false);S.pin=null;S.lockApp=false;save();render(false);toast('PIN removed')},()=>{});break;
    case 'export':exportBackup();break;
    case 'import':$('#fi').click();break;
  }
});
try{const App=reg('App');if(App&&App.addListener)App.addListener('backButton',()=>{
  if($('#viewer').classList.contains('show'))$('#viewer').classList.remove('show');
  else if(lockEl&&!S.lockApp){}else if(sheetOpen)closeSheet();else if($('#menu').classList.contains('show'))hideMenu();else if(cur)closeEditor();else if(sub){sub=null;render(true)}else if(tab!=='notes'||fTag||q){tab='notes';fTag=null;q='';render(true)}else if(App.minimizeApp)App.minimizeApp()})}catch(e){}
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{if(cur&&document.activeElement&&document.activeElement.scrollIntoView&&document.activeElement.matches('textarea'))setTimeout(()=>{try{document.activeElement.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){}},50)});
/* ---------- boot ---------- */
(function(){
  const now=Date.now();S.notes=S.notes.filter(n=>!(n.del&&now-n.del>30*86400000)||(purge(n),false));
  S.notes=S.notes.filter(n=>!isEmpty(n)||n.del);S.notes.forEach(n=>{n.b=n.b&&n.b.length?n.b:[{k:'p',x:''}];n.img=n.img||[]});
  applyPal(true);render(true);
  if(S.pin&&S.lockApp)askPin('Hydrochloric acid',()=>{});
  document.fonts&&document.fonts.ready&&document.fonts.ready.then(placeInd);
})();
})();

</script>
